services:
  - type: web
    name: kashliwal-tgp-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Neon connection string — set manually in the Render dashboard (not stored in this file)
      - key: DATABASE_URL
        sync: false
